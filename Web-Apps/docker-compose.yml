version: '3.8'

# Volume shared between MA and web-app containers.

services:

  # ── Music Assistant Server ──────────────────────────────────────────────────
  music-assistant-server:
    image: ghcr.io/music-assistant/server:latest
    container_name: music-assistant-server
    restart: unless-stopped
    network_mode: host          # Required for mDNS/UPnP ESP32 discovery
    volumes:
      - /mnt/Main_Storage/Docker_NFS/Docker_VE/501_Music_Asist/data:/data
      - /mnt/Main_Storage/Docker_NFS/Docker_VE/501_Music_Asist/media:/media
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined
    environment:
      - LOG_LEVEL=info

  # ── MariaDB ─────────────────────────────────────────────────────────────────
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secure_root_password
      MYSQL_DATABASE: audioauto
      MYSQL_USER: audioauto
      MYSQL_PASSWORD: secure_db_password
      TZ: Asia/Jayapura
    volumes:
      - ./dbs_data:/var/lib/mysql
    command: >
      --bind-address=0.0.0.0
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    networks:
      - audioauto_net

  # ── Audio-Auto Web App ───────────────────────────────────────────────────────
  web:
    build: .
    restart: always
    ports:
      - "9876:8000"             # Web UI port (Sendspin port 8927 removed)
    environment:
      # Database
      - DB_USER=audioauto
      - DB_PASS=secure_db_password
      - DB_HOST=db
      - DB_NAME=audioauto
      # Admin credentials (first-run only)
      - ADMIN_USER=admin
      - ADMIN_PASS=admin123
      - TZ=Asia/Jayapura
      # ── Music Assistant ──────────────────────────────────────────────────
      # MA uses host networking so the web-app reaches it via the host's LAN IP
      - MA_URL=http://192.168.88.8:8095
      - MA_TOKEN=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..xs1ayZnQSe8dAfY3ZxnMnlbAxaRm-lv3dla7txL_KY8
      # Name of the group player in MA (display name, case-insensitive match)
      - MA_GROUP_PLAYER=ESP32-Sync
      # Base URL MA uses to fetch uploaded audio files from this web-app
      # MA container is on host network, so it reaches the web-app via host LAN IP
      - MA_MEDIA_URL_BASE=http://192.168.88.8:9876
    volumes:
      - ./app:/app/app
      - /mnt/Main_Storage/Docker_NFS/Docker_VE/501_Music_Asist/media:/app/audio_files
    depends_on:
      - db
    networks:
      - audioauto_net

networks:
  audioauto_net:
    driver: bridge
