version: '3.8'

services:
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secure_root_password
      MYSQL_DATABASE: audioauto
      MYSQL_USER: audioauto
      MYSQL_PASSWORD: secure_db_password
      TZ: Asia/Jayapura
    volumes:
      - ./dbs_data:/var/lib/mysql
    # If you have an existing dbs_data from before, the above credentials MUST
    # match what was used when the database was first initialized.
    # To reset completely: stop containers, delete ./dbs_data folder, then restart.
    command: >
      --bind-address=0.0.0.0
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    networks:
      - audioauto_net

  web:
    build: .
    restart: always
    ports:
      - "9876:8000"
    environment:
      - DB_USER=audioauto
      - DB_PASS=secure_db_password
      - DB_HOST=db
      - DB_NAME=audioauto
      - MQTT_BROKER=192.168.88.8
      - MQTT_PORT=1883
      - MQTT_USER=inskal
      - MQTT_PASS=admin_inskal_mqtt
      # Web UI login credentials (first-run creates this admin user in DB)
      - ADMIN_USER=admin
      - ADMIN_PASS=admin123
      - TZ=Asia/Jayapura
    volumes:
      - ./app:/app/app
      - ./audio_files:/app/audio_files
    depends_on:
      - db
    networks:
      - audioauto_net

networks:
  audioauto_net:
    driver: bridge
