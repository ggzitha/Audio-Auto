<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Audio-Auto{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#1e40af',
                        darkbg: '#0f172a',
                        darkcard: '#1e293b'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Custom styles */
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .dark .glass {
            background: rgba(30, 41, 59, 0.7);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-darkbg text-gray-900 dark:text-gray-100 transition-colors duration-300 min-h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-white dark:bg-darkcard border-r border-gray-200 dark:border-gray-800 hidden md:flex flex-col shadow-lg z-10 transition-colors duration-300">
        <div class="h-16 flex items-center px-6 border-b border-gray-200 dark:border-gray-800">
            <i class="fas fa-wave-square text-primary text-2xl mr-3"></i>
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">Audio-Auto</h1>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="/" class="flex items-center px-4 py-3 text-gray-700 dark:text-gray-300 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded-xl transition-all"><i class="fas fa-play-circle w-6 text-center"></i> <span class="ml-3" data-i18n="dashboard">Dashboard</span></a>
            <a href="/scheduler" class="flex items-center px-4 py-3 text-gray-700 dark:text-gray-300 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded-xl transition-all"><i class="fas fa-calendar-alt w-6 text-center"></i> <span class="ml-3" data-i18n="scheduler">Scheduler</span></a>
            <a href="/devices" class="flex items-center px-4 py-3 text-gray-700 dark:text-gray-300 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded-xl transition-all"><i class="fas fa-microchip w-6 text-center"></i> <span class="ml-3" data-i18n="devices">Devices</span></a>
            <a href="/config" class="flex items-center px-4 py-3 text-gray-700 dark:text-gray-300 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded-xl transition-all"><i class="fas fa-cog w-6 text-center"></i> <span class="ml-3" data-i18n="config">Configuration</span></a>
            <a href="/help" class="flex items-center px-4 py-3 text-gray-700 dark:text-gray-300 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded-xl transition-all"><i class="fas fa-question-circle w-6 text-center"></i> <span class="ml-3" data-i18n="help">Help</span></a>
        </nav>
        <div class="p-4 border-t border-gray-200 dark:border-gray-800 flex justify-between items-center">
            <button id="themeToggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
                <i class="fas fa-moon dark:hidden"></i>
                <i class="fas fa-sun hidden dark:block text-yellow-400"></i>
            </button>
            <button id="langToggle" class="px-3 py-1 font-semibold rounded-md bg-gray-200 dark:bg-gray-700 hover:bg-primary hover:text-white transition-colors">EN</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-h-screen overflow-hidden relative">
        <!-- Header (Mobile) -->
        <header class="h-16 bg-white dark:bg-darkcard border-b border-gray-200 dark:border-gray-800 flex items-center justify-between px-4 md:hidden shadow-sm">
            <div class="flex items-center">
                <i class="fas fa-wave-square text-primary text-xl mr-2"></i>
                <h1 class="text-lg font-bold">Audio-Auto</h1>
            </div>
            <button id="mobileMenuBtn" class="p-2 text-gray-600 dark:text-gray-300">
                <i class="fas fa-bars text-xl"></i>
            </button>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-8 bg-gray-50 dark:bg-darkbg relative">
            <div class="absolute inset-0 bg-gradient-to-br from-blue-500/5 to-purple-500/5 pointer-events-none"></div>
            <div class="relative z-10 max-w-7xl mx-auto">
                {% block content %}{% endblock %}
            </div>
        </div>
    </main>

    <script src="/static/i18n.js"></script>
    <script src="/static/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
