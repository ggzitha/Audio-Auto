{% extends "base.html" %}

{% block title %}Dashboard - Audio-Auto{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto space-y-6" id="dashboard-view">
    
    <!-- Top Controls: Device Selection & Upload -->
    <div class="flex flex-col sm:flex-row justify-between items-center bg-white dark:bg-[#2B2B2B] p-4 rounded-xl shadow-lg transition-colors duration-300 gap-4">
        <div class="flex items-center space-x-4 w-full sm:w-auto">
            <span class="font-semibold text-gray-700 dark:text-gray-300 whitespace-nowrap">Target Device:</span>
            <select id="deviceSelect" class="w-full sm:w-auto bg-gray-100 dark:bg-gray-700 border-none rounded-lg px-4 py-2 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary outline-none transition-colors">
                <option value="all">All Devices</option>
            </select>
        </div>
        
        <div class="w-full sm:w-auto">
            <button onclick="document.getElementById('fileInput').click()" class="w-full sm:w-auto bg-primary hover:bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold transition-colors flex items-center justify-center">
                <i class="fas fa-cloud-upload-alt mr-2"></i> Upload Music
            </button>
            <input type="file" id="fileInput" class="hidden" accept=".mp3,.wav,.flac,.aac,.ogg">
        </div>
    </div>
    
    <div id="uploadStatus" class="hidden bg-white dark:bg-[#2B2B2B] p-4 rounded-xl shadow-lg transition-colors duration-300">
        <div class="w-full bg-gray-200 rounded-full h-2.5 dark:bg-gray-700">
          <div class="bg-primary h-2.5 rounded-full w-0 transition-all duration-300" id="uploadBar"></div>
        </div>
        <p class="text-xs text-center mt-2 text-primary" id="uploadText">Uploading...</p>
    </div>

    <!-- Main Player UI -->
    <div class="bg-[#f5f5f5] dark:bg-[#2B2B2B] rounded-2xl p-6 md:p-8 shadow-2xl transition-colors duration-300 text-gray-800 dark:text-gray-200 border border-gray-200 dark:border-transparent">
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-6">
            <div class="flex items-center space-x-4 md:space-x-6 w-full md:w-auto">
                <div class="w-20 h-20 md:w-24 md:h-24 rounded-full overflow-hidden shadow-lg border-2 border-white dark:border-gray-600 flex-shrink-0 bg-gray-200 dark:bg-gray-700">
                    <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?auto=format&fit=crop&q=80&w=200&h=200" alt="Cover Art" class="w-full h-full object-cover">
                </div>
                <div class="flex flex-col md:flex-row md:items-center space-y-4 md:space-y-0 md:space-x-6 w-full">
                    <div class="flex items-center space-x-3 md:space-x-4 text-gray-500 dark:text-gray-400">
                        <button id="btnPrev" class="hover:text-primary transition-colors"><i class="fas fa-step-backward text-lg md:text-xl"></i></button>
                        <button id="btnPlay" class="text-gray-800 dark:text-white hover:text-primary dark:hover:text-primary transition-colors focus:outline-none">
                            <i class="fas fa-play text-3xl md:text-4xl" id="playIcon"></i>
                        </button>
                        <button id="btnNext" class="hover:text-primary transition-colors"><i class="fas fa-step-forward text-lg md:text-xl"></i></button>
                    </div>
                    <div class="flex-1 overflow-hidden">
                        <h3 id="currentSongTitle" class="text-xl md:text-2xl font-bold text-gray-900 dark:text-white truncate">Select a song</h3>
                        <p class="text-sm text-gray-500 dark:text-gray-400">Audio-Auto Player</p>
                    </div>
                </div>
            </div>
            
            <div class="flex flex-col space-y-4 w-full md:w-48 shrink-0">
                <div class="flex items-center space-x-3 w-full">
                    <i class="fas fa-volume-up text-gray-500 dark:text-gray-400 text-lg w-5"></i>
                    <input type="range" id="volSlider" min="0" max="100" value="50" class="w-full h-1.5 bg-gray-300 rounded-lg appearance-none cursor-pointer dark:bg-gray-600 accent-primary">
                </div>
                <div class="flex items-center space-x-3 w-full text-sm text-gray-600 dark:text-gray-400">
                    <i class="fas fa-tachometer-alt text-gray-500 dark:text-gray-400 text-lg w-5 text-center"></i>
                    <select id="speedSelect" class="w-full bg-gray-200 dark:bg-gray-700 border-none rounded-lg px-2 py-1 focus:ring-1 focus:ring-primary outline-none">
                        <option value="1.0" selected>1.0x Normal</option>
                        <option value="1.5">1.5x Speed</option>
                    </select>
                </div>
            </div>
        </div>
        
        <!-- Waveform / Progress -->
        <div class="mb-8 relative group cursor-pointer" id="waveformContainer">
            <div class="flex items-end space-x-[2px] h-12 md:h-16 w-full overflow-hidden" id="waveformBars"></div>
            <div class="flex justify-between text-xs text-gray-500 dark:text-gray-400 mt-2 font-mono">
                <span id="timeElapsed">00:00</span>
                <span id="timeTotal">00:00</span>
            </div>
            <div id="progressOverlay" class="absolute top-0 left-0 h-12 md:h-16 bg-primary opacity-30 pointer-events-none transition-all duration-75" style="width: 0%;"></div>
        </div>
    </div>
    
    <!-- Playlist -->
    <div class="bg-white dark:bg-[#1e293b] rounded-2xl shadow-xl overflow-hidden mt-6">
        <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-800 font-semibold text-gray-700 dark:text-gray-300 flex justify-between">
            <span>Audio Files</span>
            <div class="relative">
                <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 text-xs"></i>
                <input type="text" id="searchInput" placeholder="Search.." class="pl-8 pr-3 py-1 text-sm bg-gray-100 dark:bg-gray-800 rounded outline-none w-48">
            </div>
        </div>
        <div class="divide-y divide-gray-100 dark:divide-gray-800 custom-scrollbar max-h-80 overflow-y-auto" id="playlistContainer">
            <div class="p-8 text-center text-gray-500">Loading files...</div>
        </div>
    </div>
</div>
{% endblock %}
