{% extends "base.html" %}

{% block title %}Scheduler - Audio-Auto{% endblock %}

{% block content %}
<style>
/* FullCalendar Google Calendar Dark Theme Override */
.fc-theme-standard td, .fc-theme-standard th {
    border-color: #374151 !important;
}
.fc .fc-toolbar-title {
    font-size: 1.5rem !important;
    font-weight: 700 !important;
    color: #f3f4f6 !important;
}
.fc-button-primary {
    background-color: transparent !important;
    border: 1px solid #4b5563 !important;
    color: #9ca3af !important;
    text-transform: capitalize !important;
    border-radius: 8px !important;
}
.fc-button-primary:hover {
    background-color: #374151 !important;
    color: #f3f4f6 !important;
}
.fc-button-active {
    background-color: #4b5563 !important;
    color: #fff !important;
}
.fc-daygrid-day-number {
    color: #9ca3af !important;
    font-weight: 500;
}
.fc-day-today {
    background-color: rgba(59, 130, 246, 0.1) !important;
}
.fc-day-today .fc-daygrid-day-number {
    background-color: #3b82f6;
    color: #fff !important;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin: 4px;
}
.fc-event {
    border-radius: 4px !important;
    border: none !important;
    font-size: 0.75rem !important;
    padding: 2px 4px !important;
    cursor: pointer !important;
}
</style>

<div class="max-w-6xl mx-auto bg-white dark:bg-[#1f2937] p-6 rounded-2xl shadow-xl" id="scheduler-view">
    <div id="calendar" class="min-h-[600px]"></div>
</div>

<!-- Add Modal -->
<div id="scheduleModal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center transition-opacity opacity-0">
    <div class="bg-white dark:bg-[#2d3748] w-full max-w-md rounded-2xl p-6 shadow-2xl transform scale-95 transition-transform duration-300" id="scheduleModalContent">
        
        <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
            <h3 class="text-xl font-bold text-white">Add Schedule</h3>
            <button onclick="closeScheduleModal()" class="text-gray-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
        </div>
        
        <form id="scheduleForm" onsubmit="saveSchedule(event)">
            <input type="hidden" id="schedId">
            <input type="hidden" id="schedRecur" value="none">
            
            <div class="flex space-x-2 mb-6">
                <button type="button" id="btnRecurNone" class="flex-1 py-1.5 rounded-full text-xs font-medium bg-primary text-white transition-colors" onclick="setRecur('none')">One Time</button>
                <button type="button" id="btnRecurDaily" class="flex-1 py-1.5 rounded-full text-xs font-medium bg-[#1a202c] border border-gray-600 text-gray-300 hover:bg-gray-700 transition-colors" onclick="setRecur('daily')">Daily</button>
                <button type="button" id="btnRecurWeekly" class="flex-1 py-1.5 rounded-full text-xs font-medium bg-[#1a202c] border border-gray-600 text-gray-300 hover:bg-gray-700 transition-colors" onclick="setRecur('weekly')">Weekly</button>
                <button type="button" id="btnRecurMonthly" class="flex-1 py-1.5 rounded-full text-xs font-medium bg-[#1a202c] border border-gray-600 text-gray-300 hover:bg-gray-700 transition-colors" onclick="setRecur('monthly')">Monthly</button>
            </div>

            <div class="space-y-4">
                <div class="flex space-x-4">
                    <div class="flex-1">
                        <label class="block text-sm text-gray-400 mb-1">Date</label>
                        <input type="date" id="schedDate" class="w-full bg-[#1a202c] border border-gray-600 rounded-lg px-3 py-2 text-white outline-none focus:border-primary dark:[color-scheme:dark]" required>
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm text-gray-400 mb-1">Time (HH:MM:SS)</label>
                        <input type="text" id="schedTime" class="w-full bg-[#1a202c] border border-gray-600 rounded-lg px-3 py-2 text-white outline-none focus:border-primary text-center" value="12:00:00" required>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Target Device</label>
                    <select id="schedDevice" class="w-full bg-[#1a202c] border border-gray-600 rounded-lg px-3 py-2 text-white outline-none focus:border-primary" required>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Audio File</label>
                    <select id="schedAudio" class="w-full bg-[#1a202c] border border-gray-600 rounded-lg px-3 py-2 text-white outline-none focus:border-primary" required>
                    </select>
                </div>
                
                <div class="pt-4 flex justify-between">
                    <button type="button" id="btnDeleteSched" onclick="deleteSchedule()" class="text-red-500 hover:bg-red-500/10 px-4 py-2 rounded-lg hidden">Delete</button>
                    <button type="submit" class="bg-primary hover:bg-blue-600 text-white px-6 py-2 rounded-lg font-medium ml-auto">Save</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
